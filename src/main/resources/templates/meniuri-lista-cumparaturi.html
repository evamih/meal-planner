<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Lista de cumpărături</title>
</head>
<body class="d-flex flex-column h-100">
<main class="flex-shrink-0">
    <section layout:fragment="body" class="py-5">
        <div class="container px-5 my-5">
            <div class="text-center mb-5">
                <h1 class="fw-bolder" th:text="'Listă de cumpărături pentru ' + ${meniu.getNume()} "></h1>
            </div>
            <table class="mb-3">
                <thead>
                <tr>
                    <th class="p-2">Nume </th>
                    <th class="p-2">Cantitate</th>
                    <th class="p-2">Unitate</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ingredient : ${ingrediente}">
                    <td class="p-2" th:text="${ingredient.getIngredient().getNume()}"></td>
                    <td class="p-2" th:text="${ingredient.getCantitate()}"></td>
                    <td class="p-2" th:text="${ingredient.getUnitate()}"></td>
                </tr>
                </tbody>
            </table>

        </div>
    </section>
</main>

</body>
</html>
