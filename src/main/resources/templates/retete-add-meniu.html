<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>Adaugare la meniu</title>
</head>
<body class="d-flex flex-column h-100">
<main class="flex-shrink-0">
  <section layout:fragment="body" class="py-5">
    <div class="container px-5 my-5">
      <div class="text-center mb-5">
        <h1 class="fw-bolder">Adaugă rețeta la unul din meniurile tale</h1>
      </div>
      <table class="mb-3">
        <thead>
        <tr>
          <th class="p-2">Nume Meniu</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="meniu : ${meniuri}">
          <td class="p-2" th:text="${meniu.getNume()}"></td>
          <td> <form th:action="@{/retete/{retetaId}/addToMenu(retetaId=${reteta.getId()}, meniuId=${meniu.getId()})}" method="post">
            <button type="submit" class="btn btn-dark p-2">Adaugă la acest meniu</button></form></td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

</body>
</html>
