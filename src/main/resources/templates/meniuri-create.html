<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Meniu nou</title>
</head>
<body class="d-flex flex-column h-100">
<main class="flex-shrink-0">
    <!-- Page Content-->
    <section layout:fragment="body" class="py-5">
        <form role="form" method="post" th:action="@{/meniuri/new}" th:object="${meniu}">
            <div class="container">
                <div class="form-row">
                    <div class="form-group col-md6 mb-3">
                        <label for="nume">Nume</label>
                        <input
                                type="text"
                                class="form-control"
                                id="nume"

                                th:field="*{nume}"
                                placeholder="Nume">
                        <p th:if="${#fields.hasErrors('nume')}" class="text-danger" th:errors="*{nume}"></p>
                    </div>
                    <div class="form-group mb-3" >
                        <label for="descriere">Descriere</label>
                        <input
                                type="text"
                                class="form-control"
                                id="descriere"

                                th:field="*{descriere}"
                                placeholder="Descriere" />
                        <p th:if="${#fields.hasErrors('descriere')}" class="text-danger" th:errors="*{descriere}"></p>
                    </div>
                    <div class="form-group mb-3" >
                        <label for="programatLa">Data programării acestui meniu</label>
                        <input
                                type="datetime-local"
                                class="form-control"
                                id="programatLa"

                                th:field="*{programatLa}"
                                th:value="${#temporals.format(programatLa, 'dd-MM-yyyy HH:mm')}"
                                placeholder="Data">
                        <p th:if="${error}" class="text-danger" th:text="${error}"></p>
                        <p th:if="${#fields.hasErrors('programatLa')}" class="text-danger" th:errors="*{programatLa}"></p>
                    </div>
                    <div class="form-group col-md-6 mb-3">
                        <label for="status">Status</label>
                        <select id="status" name="status" class="form-control" th:field="*{status}">
                            <option value="" disabled selected>Selectează o opțiune</option>
                            <option value="draft">Draft</option>
                            <option value="nou">Nou</option>
                            <option value="realizat">Realizat</option>
                        </select>
                        <p th:if="${#fields.hasErrors('status')}" class="text-danger" th:errors="*{status}"></p>
                    </div>
                </div>
                <button type="submit" method="post" class="btn btn-dark">Adaugare</button>
            </div>

        </form>
    </section>
</main>

</body>
</html>
