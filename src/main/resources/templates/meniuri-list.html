<html xmlns:th="http://thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Meniuri - lista</title>
</head>
<body class="d-flex flex-column h-100">
<main class="flex-shrink-0">
<section layout:fragment="body" class="py-5">
    <div class="container px-5 my-5">
        <div class="text-center mb-5">
            <h1 class="fw-bolder">Meniurile tale</h1>
        </div>
        <div class="row gx-5">
            <div class="col-xl-8">
                <!-- FAQ Accordion 1-->
                <div th:each="meniu :${meniuri}" class="accordion mb-5" id="accordionExample">
                    <h2 class=" mb-3" th:text="${meniu.nume}"></h2>
                    <div class="accordion-item">
                        <h3 class="accordion-header" id="status"><button th:text="'Status : ' + ${meniu.status.toUpperCase()}" class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne"></button></h3>
                        <div class="accordion-collapse collapse show" id="collapseOne" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                            <div class="accordion-body d-flex justify-content-between align-items-center">
                                <div>
                                <strong>Descrierea meniului: </strong>
                                <p th:text="${meniu.descriere}"></p>
                                <strong>Meniu programat pentru data de: </strong>
                                <p th:text="${#temporals.format(meniu.programatLa, 'dd-MM-yyyy HH:mm')}"></p>
                                <a class="btn-dark link-dark" th:href="@{/meniuri/{meniuId}/retete(meniuId=${meniu.id})}">Vezi rețetele din acest meniu</a> <br>
                                <a class="btn-dark link-dark mb-2" th:href="@{/meniuri/{meniuId}/lista(meniuId=${meniu.id})}">Generează o listă de cumpărături pentru acest meniu</a> <br>
                                <a class="btn btn-dark mt-1" th:href="@{/meniuri/{meniuId}/edit(meniuId=${meniu.id})}">Edit</a>
                                <a class="btn btn-dark mt-1" th:href="@{/meniuri/{meniuId}/delete/confirm(meniuId=${meniu.id})}">Șterge</a>
                                </div>
                                <div th:if="${meniu.status == 'nou' or meniu.status == 'draft'}">
                                    <br>
                                    <form th:action="@{/meniuri/{meniuId}/markDone(meniuId=${meniu.id})}" method="post">
                                        <button type="submit" class="btn btn-success p-2">Realizat</button>
                                    </form>
                                </div>
                                <div th:if="${meniu.status} == 'realizat'">
                                    <br>
                                    <form th:action="@{/meniuri/{meniuId}/markDraft(meniuId=${meniu.id})}" method="post">
                                        <button type="submit" class="btn btn-danger p-2">Draft</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</main>
</body>
</html>
